name: Public project URL identity scanning
on:
  pull_request:
  push:
    branches: [fix/package-public-project-urls]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tests/package_scan_test.py
