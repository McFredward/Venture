name: Preview packaging
on:
  pull_request:
  push:
    branches: [feat/preview-packaging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tests/install_preview_test.py
      - run: python tests/preview_package_test.py
