# Static font configuration for the bundled headless JRE: used when the
# system has no fontconfig. Every logical font maps to the bundled DejaVu Sans.
version=1
allfonts.dejavu=DejaVu Sans
sequence.allfonts=dejavu
serif.plain.dejavu=DejaVu Sans
serif.bold.dejavu=DejaVu Sans Bold
serif.italic.dejavu=DejaVu Sans
serif.bolditalic.dejavu=DejaVu Sans Bold
sansserif.plain.dejavu=DejaVu Sans
sansserif.bold.dejavu=DejaVu Sans Bold
sansserif.italic.dejavu=DejaVu Sans
sansserif.bolditalic.dejavu=DejaVu Sans Bold
monospaced.plain.dejavu=DejaVu Sans
monospaced.bold.dejavu=DejaVu Sans Bold
monospaced.italic.dejavu=DejaVu Sans
monospaced.bolditalic.dejavu=DejaVu Sans Bold
dialog.plain.dejavu=DejaVu Sans
dialog.bold.dejavu=DejaVu Sans Bold
dialog.italic.dejavu=DejaVu Sans
dialog.bolditalic.dejavu=DejaVu Sans Bold
dialoginput.plain.dejavu=DejaVu Sans
dialoginput.bold.dejavu=DejaVu Sans Bold
dialoginput.italic.dejavu=DejaVu Sans
dialoginput.bolditalic.dejavu=DejaVu Sans Bold
filename.DejaVu_Sans=$JRE_LIB_FONTS/DejaVuSans.ttf
filename.DejaVu_Sans_Bold=$JRE_LIB_FONTS/DejaVuSans-Bold.ttf
